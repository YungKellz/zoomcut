appId: dev.zoomcut.app
productName: ZoomCut
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/uiohook-napi/**
# bundled CC0 music library (resources/music) for the "Add music" picker - see
# src/main/audio/musicLibrary.ts musicDir(), which reads it from here once packaged
extraResources:
  - from: resources/music
    to: music
    filter:
      - '*.m4a'
      - manifest.json
      - README.md
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
nsis:
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
portable:
  artifactName: ${productName}-Portable-${version}-${arch}.${ext}
# electron-updater reads owner/repo from resources/app-update.yml, which this generates
publish:
  provider: github
  owner: YungKellz
  repo: zoomcut
