appId: dev.zoomcut.app
productName: ZoomCut
directories:
  output: release
  buildResources: build
files:
  - out/**
  # the MCP bridge ships next to the exe (extraResources below), not inside the asar
  - '!out/mcp/**'
  - package.json
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/uiohook-napi/**
# bundled CC0 music library (resources/music) for the "Add music" picker - see
# src/main/audio/musicLibrary.ts musicDir(), which reads it from here once packaged
extraResources:
  # the stdio MCP bridge for AI agents (src/mcp), run under ZoomCut.exe with ELECTRON_RUN_AS_NODE=1 -
  # see src/main/agent/mcpConfig.ts
  - from: out/mcp/zoomcut-mcp.cjs
    to: mcp/zoomcut-mcp.cjs
  - from: resources/music
    to: music
    filter:
      - '*.m4a'
      - manifest.json
      - README.md
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
nsis:
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
portable:
  artifactName: ${productName}-Portable-${version}-${arch}.${ext}
# electron-updater reads owner/repo from resources/app-update.yml, which this generates
publish:
  provider: github
  owner: YungKellz
  repo: zoomcut
