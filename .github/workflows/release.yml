name: Release

# Pushing a tag like v0.2.0 builds the Windows installer + portable exe and attaches them to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist
      - name: Upload installer and portable exe to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --title "ZoomCut ${{ github.ref_name }}" --generate-notes release/*.exe || gh release upload "${{ github.ref_name }}" release/*.exe --clobber
