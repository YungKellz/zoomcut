name: Release

# Pushing a tag like v0.2.0 builds the Windows installer + portable exe and publishes a GitHub
# release with them, latest.yml and the .blockmap (installed apps read the last two to update).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          node scripts/release-notes.cjs "$tag" > release-notes.md
          assets=(release/*.exe release/*.blockmap release/latest.yml)
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            # created as a draft first, so the updater never sees a release without its files
            gh release create "$tag" --draft --title "ZoomCut $tag" --notes-file release-notes.md "${assets[@]}"
            gh release edit "$tag" --draft=false
          fi
